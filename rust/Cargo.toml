[package]
name = "resilient-call"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Resilience primitives: async retry with full-jitter exponential backoff, tokio timeout wrapper, CockroachDB serializable-retry (SQLSTATE 40001), and a file-backed idempotency ledger for guarding money/state operations."
readme = "README.md"
repository = "https://github.com/icohangar-ops/cubiczan-resilience"
homepage = "https://github.com/icohangar-ops/cubiczan-resilience"
documentation = "https://docs.rs/resilient-call"
authors = ["Shyam Desigan <sam@cubiczan.com>"]
keywords = ["retry", "backoff", "jitter", "idempotency", "cockroachdb"]
categories = ["asynchronous", "database"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
tokio = { version = "1", features = ["time", "macros", "rt"] }
rand = "0.8"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "test-util"] }
tempfile = "3"
